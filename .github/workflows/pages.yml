name: Deploy static site to Pages

# The legacy Jekyll pipeline stopped completing: the build succeeded every time
# but the deploy step sat in `deployment_queued` until it hit the 10-minute cap
# and aborted. This workflow publishes the same tree through the Actions Pages
# pipeline instead. The site is plain static HTML, so nothing needs building.
#
# To activate: repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
